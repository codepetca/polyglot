name: Notification tests

on:
  pull_request:
    paths:
      - .github/workflows/discord-pr.yml
      - .github/workflows/notification-tests.yml
      - package.json
      - scripts/notify-discord-pr.mjs
      - scripts/notify-discord-pr.test.mjs
  push:
    branches:
      - main
    paths:
      - .github/workflows/discord-pr.yml
      - .github/workflows/notification-tests.yml
      - package.json
      - scripts/notify-discord-pr.mjs
      - scripts/notify-discord-pr.test.mjs

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - run: npm run test:discord-pr
